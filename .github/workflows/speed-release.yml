name: Release APK

# Every push to main releases a new patch version automatically (tag + GitHub
# release + update manifests); tag pushes v* release that exact version.
on:
  workflow_dispatch:
    inputs:
      bridge:
        description: "衔接发版：按旧设备校验器发布（旧文件名 + min_sdk 23），供 0.2.169 及更早版本自动升级一次"
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.meta.outputs.skip }}
      version: ${{ steps.meta.outputs.version }}
      code: ${{ steps.meta.outputs.code }}
      tag: ${{ steps.meta.outputs.tag }}
      bridge: ${{ github.event.inputs.bridge == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: meta
        run: |
          set -e
          # A manifest commit from this very workflow must not trigger
          # another build/release cycle.
          if git log -1 --format=%s | grep -q '^ci: update manifests'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Manifest-only commit: skipping."
            exit 0
          fi
          # A "[bridge]" marker in the head commit subject forces the bridge
          # release (old asset names + min_sdk 23) so installs of 0.2.169 and
          # earlier can cross over to the new update channel automatically.
          BRIDGE_COMMIT=false
          if git log -1 --format=%s | grep -q '\[bridge\]'; then BRIDGE_COMMIT=true; fi
          case "$GITHUB_REF_NAME" in
            v*)
              # Tag push: release exactly the tagged version.
              VERSION="${GITHUB_REF_NAME#v}"
              ;;
            *)
              # Branch push: auto-release the next patch version so every
              # commit ships. versionCode (base*10000 + minor*100 + patch)
              # therefore increases with every commit and phones auto-update.
              BASE=$(git describe --tags --abbrev=0 | sed 's/^v//')
              MAJOR=$(echo "$BASE" | awk -F. '{print $1}')
              MINOR=$(echo "$BASE" | awk -F. '{print $2}')
              PATCH=$(echo "$BASE" | awk -F. '{print $3}')
              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
          esac
          TAG="v$VERSION"
          CODE=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          BRIDGE=false
          if [ "$BRIDGE_COMMIT" = "true" ]             || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${GITHUB_EVENT_INPUTS_BRIDGE:-}" = "true" ]; }; then
            BRIDGE=true
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, code $CODE, tag $TAG, bridge $BRIDGE"

  release:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: hongguo-speed-release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CODE: ${{ needs.version.outputs.code }}
      TAG: ${{ needs.version.outputs.tag }}
      BRIDGE: ${{ needs.version.outputs.bridge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # The NDK archive occasionally arrives truncated from the Android
          # repository. Retry after clearing only sdkmanager's temp download;
          # a transient mirror failure must not consume the whole release.
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"; then
              exit 0
            fi
            echo "Android SDK package install failed (attempt $attempt), retrying…" >&2
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/ndk/27.2.12479018"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Pin build.gradle to the build version
        run: |
          set -e
          test -n "$VERSION" && test -n "$CODE"
          # Anchored replacements: a loose "versionCode [0-9]*" would also hit
          # the flavor's "versionCode mpvVersionCode" reference and corrupt it.
          # The version code derives from appVersion inside build.gradle with
          # the same formula this pipeline uses, so only the name needs pinning.
          sed -i "s/def appVersion = \".*\"/def appVersion = \"$VERSION\"/" android/app/build.gradle
          grep -E "def appVersion|versionCode" android/app/build.gradle | head -3

      - name: Restore signing key
        run: |
          set -e
          test -n "$ANDROID_KEYSTORE_FILE_B64" || { echo "Missing release signing key secret" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_FILE_B64" | base64 --decode > android/hongguotv-release.jks
          cat > android/keystore.properties <<EOF
          STORE_FILE=../hongguotv-release.jks
          STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          KEY_ALIAS=$ANDROID_KEY_ALIAS
          KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_FILE_B64: ${{ secrets.ANDROID_KEYSTORE_FILE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Test Go core
        run: go test ./core/...

      - name: Check TV JavaScript
        run: |
          node --check core/cmd/hongguotv/ui/app.js
          node --check core/cmd/hongguotv/ui/episode-prefetch.js
          node --check core/cmd/hongguotv/ui/native-player.js
          node --check core/cmd/hongguotv/ui/playback-settings.js
          node --check core/cmd/hongguotv/ui/auto-cinema.js

      - name: Run UI regression suite
        run: node --test tests/*.test.cjs

      - name: Build Go cores (three ABIs, Android 5.0+)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT=android/app/src/main/jniLibs
          build() {
            GOOS=android GOARCH=$2 CGO_ENABLED=1 \
            CC="$NDK_BIN/$3" \
            go build -trimpath -buildmode=pie -ldflags "-s -w -X main.version=$VERSION" \
            -o "$OUT/$1/libhongguotv.so" ./core/cmd/hongguotv
          }
          build arm64-v8a   arm64 aarch64-linux-android21-clang
          build armeabi-v7a arm   armv7a-linux-androideabi21-clang
          build x86_64      amd64 x86_64-linux-android21-clang
          ls -la $OUT/*/libhongguotv.so

      - name: Fetch mpv-android libraries
        run: |
          set -e
          mkdir -p mpv-dl && cd mpv-dl
          for abi in arm64-v8a armeabi-v7a x86; do
            curl -sL --retry 3 -o apk-$abi "https://github.com/mpv-android/mpv-android/releases/download/2026-09-17/app-default-$abi-release.apk"
            unzip -o -q apk-$abi "lib/$abi/*" -d ext-$abi
          done
          OUT=../android/app/src/mpv/jniLibs
          mkdir -p $OUT/arm64-v8a $OUT/armeabi-v7a $OUT/x86 $OUT/x86_64
          cp ext-arm64-v8a/lib/arm64-v8a/*.so $OUT/arm64-v8a/
          cp ext-armeabi-v7a/lib/armeabi-v7a/*.so $OUT/armeabi-v7a/
          cp ext-x86/lib/x86/*.so $OUT/x86/
          # x86_64 emulators reuse the x86 libraries; the device build only
          # ships arm64 and armv7 with the bridge compiled per ABI.
          cp ext-x86/lib/x86/*.so $OUT/x86_64/

      - name: Restore mpv client header
        run: |
          set -e
          mkdir -p android/mpv-jni/include/mpv
          # The client API is stable; the header from the matching mpv
          # generation works for the bridged calls this project uses.
          curl -sL --retry 3 -o android/mpv-jni/include/mpv/client.h             https://raw.githubusercontent.com/mpv-player/mpv/v0.40.0/include/mpv/client.h
          grep -c "mpv_create" android/mpv-jni/include/mpv/client.h

      - name: Build MPV JNI bridge
        run: |
          set -e
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          for t in "arm64-v8a aarch64-linux-android21" "armeabi-v7a armv7a-linux-androideabi21" "x86 i686-linux-android21"; do
            set -- $t
            "$NDK_BIN/clang++" --target=$2 --sysroot="$SYSROOT"               -std=c++17 -O2 -fPIC -shared -static-libstdc++ -Wl,--no-undefined               -Iandroid/mpv-jni/include android/mpv-jni/bridge.cpp               -Landroid/app/src/mpv/jniLibs/$1 -lmpv -lavcodec -landroid               -o android/app/src/mpv/jniLibs/$1/libhongguompv.so
          done
          ls -la android/app/src/mpv/jniLibs/arm64-v8a/libhongguompv.so

      - name: Assemble APKs
        run: |
          set -e
          # Package the two flavors in separate Gradle invocations: AGP's
          # native-library splitter can race when both flavors are packaged
          # in the same invocation on a hosted runner.
          gradle --no-daemon --max-workers=1 -p android assembleStandardRelease
          gradle --no-daemon --max-workers=1 -p android assembleMpvRelease

      - name: Verify APK signature
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/standard/release/app-standard-release.apk | head -2
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/mpv/release/app-mpv-release.apk | head -2

      - name: Extract release notes
        run: |
          set -e
          mkdir -p stage
          python3 scripts/extract_release_notes.py "$VERSION" stage/release_notes.md
          # Fallback: summarize the commits since the previous tag so the
          # notes always describe what actually shipped in this build.
          if [ ! -s stage/release_notes.md ]; then
            PREV=$(git describe --tags --abbrev=0 "v$VERSION^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
            git log --format='- %s' "$RANGE" | grep -v 'ci: update manifests' > stage/release_notes.md || true
            [ -s stage/release_notes.md ] || echo '- 稳定性修复与体验优化。' > stage/release_notes.md
          fi

      - name: Stage speed-edition assets and manifests
        run: |
          set -e
          test -n "$VERSION" && test -n "$CODE" && test -n "$TAG"
          mkdir -p stage
          cp android/app/build/outputs/apk/mpv/release/app-mpv-release.apk "stage/hongguo-tv-speed-mpv-$VERSION.apk"
          # The MPV build is identical for TV, phone and car; it ships twice
          # under two names so downloads match the device at hand.
          cp android/app/build/outputs/apk/mpv/release/app-mpv-release.apk "stage/hongguo-phone-speed-mpv-$VERSION.apk"
          cp android/app/build/outputs/apk/standard/release/app-standard-release.apk "stage/hongguo-tv-speed-$VERSION.apk"
          if [ "$BRIDGE" = "true" ]; then
            # Bridge release for installs of 0.2.169 and earlier: their built-in
            # validator only accepts the old asset name and a manifest that
            # declares min_sdk >= 23. The APK inside carries the new validator,
            # so the NEXT regular release reaches them again.
            MANIFEST_MIN_SDK=23
          else
            MANIFEST_MIN_SDK=21
          fi
          python3 - "$VERSION" "$CODE" "$MANIFEST_MIN_SDK" <<'PY'
          import hashlib, io, json, sys
          version, code, min_sdk = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          with io.open('stage/release_notes.md', encoding='utf-8') as handle:
              notes = handle.read().strip()
          base = 'https://github.com/jingrongx/hongguo-tv-speed/releases/download/v' + version + '/'
          variants = (
              ('mpv', 'com.jingrongx.hongguotv.mpv', 'hongguo-tv-speed-mpv-' + version + '.apk', 'update-mpv.json'),
              ('standard', 'com.jingrongx.hongguotv', 'hongguo-tv-speed-' + version + '.apk', 'update.json'),
          )
          for variant, package, artifact, name in variants:
              with open('stage/' + artifact, 'rb') as handle:
                  blob = handle.read()
              manifest = {
                  'schema': 1,
                  'version_code': code,
                  'min_sdk': min_sdk,
                  'version_name': version,
                  'package_name': package,
                  'size': len(blob),
                  'sha256': hashlib.sha256(blob).hexdigest(),
                  'download_url': base + artifact,
                  'release_notes': notes,
                  'variant': variant,
              }
              with io.open('stage/' + name, 'w', encoding='utf-8', newline='\n') as handle:
                  json.dump(manifest, handle, ensure_ascii=False, indent=2)
                  handle.write('\n')
          PY
          sha256sum stage/*.apk > stage/SHA256SUMS.txt
          python3 -c "import json; json.load(open('stage/update-mpv.json')); json.load(open('stage/update.json')); print('manifests valid')"

      - name: Remove temporary signing key
        if: always()
        run: rm -f android/hongguotv-release.jks android/keystore.properties

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          {
            cat stage/release_notes.md
            echo
            if [ "$BRIDGE" = "true" ]; then
              echo "**衔接版本**：老版本（≤0.2.169）会通过每小时自动检查收到本版；装上本版后，后续新版本即可恢复正常自动更新。"
              echo "**MPV 版**：hongguo-tv-speed-mpv-$VERSION.apk"
              echo "**标准版**：hongguo-tv-speed-$VERSION.apk"
            else
              echo "**电视 MPV 版**（推荐）：hongguo-tv-speed-mpv-$VERSION.apk"
              echo "**手机 MPV 版**（与电视 MPV 版相同安装包）：hongguo-phone-speed-mpv-$VERSION.apk"
              echo "**标准版**：hongguo-tv-speed-$VERSION.apk"
            fi
          } > stage/release_body.md
          # gh release create also creates the tag at this commit when the
          # tag does not exist yet (branch-push auto releases).
          gh release create "$TAG" --title "红果极速 v$VERSION"             --notes-file stage/release_body.md --draft=false --prerelease=false             || gh release upload "$TAG" stage/hongguo-tv-speed-mpv-$VERSION.apk stage/hongguo-phone-speed-mpv-$VERSION.apk stage/hongguo-tv-speed-$VERSION.apk stage/SHA256SUMS.txt --clobber
          gh release upload "$TAG" stage/hongguo-tv-speed-mpv-$VERSION.apk stage/hongguo-phone-speed-mpv-$VERSION.apk stage/hongguo-tv-speed-$VERSION.apk stage/SHA256SUMS.txt --clobber
          # Re-runs must refresh a stale body, not only the assets.
          gh release edit "$TAG" --notes-file stage/release_body.md

      - name: Publish update manifests to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "speed-release-bot"
          git config user.email "jingrongx@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp stage/update-mpv.json update-mpv.json
          cp stage/update.json update.json
          git add update-mpv.json update.json
          git diff --cached --quiet && { echo "manifests unchanged"; exit 0; }
          git commit -m "ci: update manifests for v$VERSION"
          # The daily orientation crawler can move main while this run builds;
          # a rejected push is retried after rebase instead of failing the run.
          for attempt in 1 2 3; do
            if git push origin main; then
              # Point the release tag at the commit that carries the manifests.
              git tag -f "$TAG"
              git push -f origin "$TAG"
              exit 0
            fi
            echo "manifest push rejected (attempt $attempt), rebasing…" >&2
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          echo "manifest push failed after retries" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ needs.version.outputs.version }}
          path: stage/*.apk
          retention-days: 14
