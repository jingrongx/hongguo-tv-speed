name: Orientation crawler

# Maintains the embedded orientation database with no human work: measure
# newly published dramas from the public category shelves (a ~64 KB MP4
# header fetch per drama, never a download), merge them into the committed
# JSON, and push the result to main. Every release then embeds the freshest
# database, and running installs refresh from the same file.
on:
  schedule:
    # 20:00 UTC ≈ 04:00 北京时间, daily.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      max_new:
        description: Maximum new dramas measured this run
        default: "400"
      max_pages:
        description: Maximum category pages enumerated this run
        default: "60"

permissions:
  contents: write

concurrency:
  group: orientation-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Rebase-proof: always crawl on top of the latest main.
          ref: main
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: go.mod
      - name: Crawl orientations
        id: crawl
        run: |
          set -euo pipefail
          OUT=core/cmd/hongguotv/data/series-orientation.json
          BEFORE=$(python3 -c "import json;print(len(json.load(open('$OUT'))['series']))" 2>/dev/null || echo 0)
          go run ./core/cmd/hongguotv -crawl-orientation \
            -crawl-out "$OUT" \
            -crawl-max "${{ github.event.inputs.max_new || '400' }}" \
            -crawl-pages "${{ github.event.inputs.max_pages || '60' }}"
          AFTER=$(python3 -c "import json;print(len(json.load(open('$OUT'))['series']))" 2>/dev/null || echo 0)
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
          echo "Orientations: $BEFORE -> $AFTER"
      - name: Commit refreshed database
        run: |
          set -euo pipefail
          git config user.name "orientation-crawler"
          git config user.email "actions@users.noreply.github.com"
          git add core/cmd/hongguotv/data/series-orientation.json
          if git diff --cached --quiet; then
            echo "No new orientations to commit."
            exit 0
          fi
          git commit -m "chore: refresh orientation database (${{ steps.crawl.outputs.before }} -> ${{ steps.crawl.outputs.after }} series)"
          # Rebase over anything the release pipeline pushed meanwhile.
          git pull --rebase origin main
          git push origin HEAD:main
