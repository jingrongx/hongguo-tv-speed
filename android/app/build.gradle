plugins {
    id "com.android.application"
}

def appVersion = "0.2.159"
// Same formula as the release pipeline: major*10000 + minor*100 + patch,
// so a locally built APK always upgrades cleanly over a CI-built one.
def computedVersionCode = appVersion.tokenize('.').withIndex().collect { part, i -> (part as int) * (i == 0 ? 10000 : i == 1 ? 100 : 1) }.sum()
def coreVersion = System.getenv("HONGGUO_CORE_VERSION") ?: "${appVersion}-dev"
// Local release signing reads android/keystore.properties (never committed).
// CI keeps the environment-variable path.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def localSigningReady = ["STORE_FILE", "STORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD"].every { p ->
    keystoreProperties.getProperty(p) != null && !keystoreProperties.getProperty(p).trim().isEmpty()
}
def signingVariables = ["ANDROID_KEYSTORE_FILE", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"]
def envSigningReady = signingVariables.every { System.getenv(it) }
def releaseSigningReady = localSigningReady || envSigningReady

android {
    namespace "rocks.aston.hongguotv"
    compileSdk 35

    flavorDimensions "player"

    defaultConfig {
        applicationId "com.jingrongx.hongguotv"
        minSdk 23
        targetSdk 35
        versionCode computedVersionCode
        versionName appVersion
        buildConfigField "String", "CORE_VERSION", "\"${coreVersion}\""
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    productFlavors {
        standard {
            dimension "player"
            resValue "string", "app_name", "红果极速"
            buildConfigField "String", "VARIANT_ID", '"standard"'
            buildConfigField "String", "PLAYER_ENGINE", '"webview_media3"'
        }
        mpv {
            dimension "player"
            applicationIdSuffix ".mpv"
            minSdk 23
            versionCode computedVersionCode
            resValue "string", "app_name", "红果极速"
            buildConfigField "String", "VARIANT_ID", '"mpv"'
            buildConfigField "String", "PLAYER_ENGINE", '"mpv"'
        }
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (localSigningReady) {
                storeFile file(keystoreProperties.getProperty("STORE_FILE"))
                storePassword keystoreProperties.getProperty("STORE_PASSWORD")
                keyAlias keystoreProperties.getProperty("KEY_ALIAS")
                keyPassword keystoreProperties.getProperty("KEY_PASSWORD")
            } else if (envSigningReady) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "红果极速"
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// Never upload an unsigned APK when release credentials are missing.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.startsWith("validateSigning") && it.name.endsWith("Release") } && !releaseSigningReady) {
        throw new GradleException("Release signing requires all four Android signing environment variables")
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.tvprovider:tvprovider:1.0.0"
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
    // LGPL native libraries are staged only in src/mpv/jniLibs by prepare_mpv.py.
    // No MPV AAR or transitive GPL binary is included in the standard flavor.
    testImplementation "junit:junit:4.13.2"
}
